<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ERP Pro Ultra</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#eef1f6;
    overflow:hidden;
}

/* ===== CABECERA ===== */
.top-bar{
    height:40px;
    background:#0078D7;
    color:white;
    display:flex;
    align-items:center;
    padding:0 15px;
    font-weight:bold;
}

/* ===== SUBMENU ===== */
.submenu{
    height:40px;
    background:white;
    display:flex;
    align-items:center;
    gap:20px;
    padding:0 15px;
    border-bottom:1px solid #ddd;
}

.submenu button{
    background:none;
    border:none;
    cursor:pointer;
    font-size:14px;
    padding:6px 10px;
    border-radius:6px;
    transition:.2s;
}

.submenu button:hover{
    background:#e5f1fb;
}

.submenu button.activo{
    background:#0078D7;
    color:white;
}

/* ===== WORKSPACE ===== */
.workspace{
    position:absolute;
    top:80px;
    bottom:45px;
    left:0;
    right:0;
    overflow:hidden;
}

/* ===== VENTANA ===== */
.ventana{
    position:absolute;
    width:700px;
    height:450px;
    background:white;
    border-radius:12px;
    display:flex;
    flex-direction:column;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
    overflow:hidden;
    animation:fadeIn .15s ease-out;
}

@keyframes fadeIn{
    from{transform:scale(.97);opacity:.7}
    to{transform:scale(1);opacity:1}
}

.ventana.activa{
    box-shadow:0 20px 40px rgba(0,0,0,0.35);
}

/* HEADER */
.ventana-header{
    height:40px;
    background:#f3f3f3;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 10px;
    cursor:move;
}

/* BOTONES */
.botones span{
    width:14px;
    height:14px;
    border-radius:50%;
    display:inline-block;
    margin-left:6px;
    cursor:pointer;
}
.cerrar{background:#ff5f57;}
.minimizar{background:#ffbd2e;}
.maximizar{background:#28c840;}

.ventana-body{
    flex:1;
    overflow:auto;
    padding:15px;
}

.ventana-footer{
    height:30px;
    background:#f3f3f3;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 10px;
    font-size:13px;
}

/* ===== TASKBAR ===== */
.taskbar{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:45px;
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(10px);
    border-top:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 10px;
    gap:5px;
}

.task-item{
    padding:5px 10px;
    background:#e4e4e4;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
    transition:.2s;
}

.task-item.activa{
    background:#0078D7;
    color:white;
}
</style>
</head>
<body>

<div class="top-bar">ERP PRO</div>

<div class="submenu">
    <button onclick="crearVentana(this,'Inventario','inventario.html')">Inventario</button>
    <button onclick="crearVentana(this,'Compras','compras.html')">Compras</button>
    <button onclick="crearVentana(this,'Ventas','ventas.html')">Ventas</button>
</div>

<div class="workspace" id="workspace"></div>
<div class="taskbar" id="taskbar"></div>

<script>
let zIndex=1;
let ventanaActiva=null;
let idCounter=0;
const cache={}; // cache para velocidad

/* ===== CREAR VENTANA ===== */
function crearVentana(boton,titulo,archivo){

    document.querySelectorAll(".submenu button")
        .forEach(b=>b.classList.remove("activo"));
    boton.classList.add("activo");

    const workspace=document.getElementById("workspace");

    const ventana=document.createElement("div");
    ventana.className="ventana activa";
    ventana.style.zIndex=++zIndex;
    ventana.dataset.id=++idCounter;

    ventana.style.left=(100+idCounter*20)+"px";
    ventana.style.top=(80+idCounter*20)+"px";

    ventana.innerHTML=`
        <div class="ventana-header">
            <div>${titulo}</div>
            <div class="botones">
                <span class="minimizar"></span>
                <span class="maximizar"></span>
                <span class="cerrar"></span>
            </div>
        </div>
        <div class="ventana-body">Cargando...</div>
        <div class="ventana-footer">
            <div class="fecha"></div>
            <div class="hora"></div>
        </div>
    `;

    workspace.appendChild(ventana);

    cargarModulo(archivo,ventana.querySelector(".ventana-body"));

    activarVentana(ventana);
    hacerDrag(ventana);
    botonesVentana(ventana);
    reloj(ventana);
    agregarTask(ventana,titulo);
}

/* ===== CARGA ULTRA RÁPIDA ===== */
function cargarModulo(archivo,contenedor){

    if(cache[archivo]){
        contenedor.innerHTML=cache[archivo];
        return;
    }

    fetch(archivo)
        .then(r=>r.text())
        .then(html=>{
            cache[archivo]=html;
            contenedor.innerHTML=html;
        })
        .catch(()=>{
            contenedor.innerHTML="<h3>Error cargando módulo</h3>";
        });
}

/* ===== ACTIVAR ===== */
function activarVentana(v){
    document.querySelectorAll(".ventana").forEach(el=>el.classList.remove("activa"));
    document.querySelectorAll(".task-item").forEach(el=>el.classList.remove("activa"));

    v.classList.add("activa");
    v.style.zIndex=++zIndex;
    ventanaActiva=v;

    document.querySelector(`[data-task='${v.dataset.id}']`)
        ?.classList.add("activa");
}

/* ===== DRAG FLUIDO ===== */
function hacerDrag(v){
    const header=v.querySelector(".ventana-header");
    let offsetX,offsetY,drag=false;

    header.addEventListener("mousedown",e=>{
        activarVentana(v);
        drag=true;
        offsetX=e.clientX-v.offsetLeft;
        offsetY=e.clientY-v.offsetTop;
    });

    document.addEventListener("mousemove",e=>{
        if(!drag) return;
        requestAnimationFrame(()=>{
            v.style.left=(e.clientX-offsetX)+"px";
            v.style.top=(e.clientY-offsetY)+"px";
        });
    });

    document.addEventListener("mouseup",()=>drag=false);

    header.ondblclick=()=>{
        if(v.classList.contains("max")){
            v.style.width="700px";
            v.style.height="450px";
            v.classList.remove("max");
        }else{
            v.style.left="0";
            v.style.top="0";
            v.style.width="100%";
            v.style.height="100%";
            v.classList.add("max");
        }
    };
}

/* ===== BOTONES ===== */
function botonesVentana(v){
    v.querySelector(".cerrar").onclick=()=>{
        document.querySelector(`[data-task='${v.dataset.id}']`)?.remove();
        v.remove();
    };
    v.querySelector(".minimizar").onclick=()=>v.style.display="none";
}

/* ===== TASKBAR ===== */
function agregarTask(v,titulo){
    const task=document.createElement("div");
    task.className="task-item activa";
    task.innerText=titulo;
    task.dataset.task=v.dataset.id;

    task.onclick=()=>{
        if(v.style.display==="none") v.style.display="flex";
        activarVentana(v);
    };

    document.getElementById("taskbar").appendChild(task);
}

/* ===== RELOJ ===== */
function reloj(v){
    const fecha=v.querySelector(".fecha");
    const hora=v.querySelector(".hora");

    function actualizar(){
        const now=new Date();
        fecha.innerText=now.toLocaleDateString("es-ES");
        hora.innerText=now.toLocaleTimeString("es-ES");
    }
    actualizar();
    setInterval(actualizar,1000);
}

/* ESC cerrar */
document.addEventListener("keydown",e=>{
    if(e.key==="Escape" && ventanaActiva){
        document.querySelector(`[data-task='${ventanaActiva.dataset.id}']`)?.remove();
        ventanaActiva.remove();
    }
});
</script>

</body>
</html>
