<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Productos</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="window">
        <div class="header-section">REGISTRO DE PRODUCTOS</div>

        <div class="toolbar">
            <button class="toolbar-btn">📄 Nuevo</button>
            <button class="toolbar-btn">🔄 Actualizar</button>
            <button class="toolbar-btn">📥 Importar</button>
            <button class="toolbar-btn">📤 Exportar</button>
            <button class="toolbar-btn" onclick="document.querySelectorAll('mi-modal')[0].open()">⚙️ Parámetros</button>
        </div>

        <div class="content">

            <!-- ================== LISTA ================== -->
            <div class="left-panel">

                <div class="panel-title">Lista de Productos</div>

                <div class="search-box">
                    <label>Buscar:</label>
                    <input type="text" id="search">
                </div>

                <div class="table-section">
                    <table class="table table-bordered tabla-fija">
                        <thead>
                            <tr>
                                <!-- <th>ID</th> -->
                                <th>Código</th>
                                <th class="col-nombre">Descripción</th>
                                <th>Precio</th>
                                <th>Grupo</th>
                                <th>SubGrupo</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>

                <div class="bottom-bar">
                    <div class="counter-box" id="counter">0</div>
                </div>

            </div>

            <!-- ================== FORMULARIO / RIGHT PANEL ================== -->
            <div class="right-panel">
                <!-- TABS -->
                <div class="tabs">
                    <div class="tab active" onclick="switchTab(event, 'registro')">Registro</div>
                    <div class="tab" onclick="switchTab(event, 'precios')">Precios</div>
                    <div class="tab" onclick="switchTab(event, 'disponible')">Disponible</div>
                </div>

                <!-- CONTENIDO DE LOS TABS -->
                <div class="right-panel-body">

                    <!-- TAB REGISTRO -->
                    <div id="tab-registro" class="tab-content">
                        <div class="form-row-2col">
                            <div class="form-field">
                                <label>Código</label>
                                <input type="text" id="codigo">
                            </div>
                            <div class="form-field">
                                <label>Marca/Tipo</label>
                                <select id="marca"></select>
                            </div>
                        </div>

                        <div class="form-row-2col">
                            <div class="form-field">
                                <label>Grupo</label>
                                <select id="grupo"></select>
                            </div>
                            <div class="form-field">
                                <label>Origen</label>
                                <select id="origen"></select>
                            </div>
                        </div>

                        <div class="form-row-2col">
                            <div class="form-field">
                                <label>SubGrupo</label>
                                <select id="subGrupo"></select>
                            </div>
                            <div class="form-field">
                                <label>Industria</label>
                                <select id="industria"></select>
                            </div>
                        </div>

                        <div class="form-field">
                            <label>Descripción</label>
                            <input type="text" id="descripcion">
                        </div>

                        <div class="form-row-2col">
                            <div>
                                <div class="form-field">
                                    <label>Medida</label>
                                    <select id="medida"></select>
                                </div>
                                <div class="form-field">
                                    <label>Estado</label>
                                    <select id="estado"></select>
                                </div>
                            </div>
                            <div>
                                <div class="factores-box">
                                    <div class="factores-box-title">Factores</div>
                                    <div class="form-field">
                                        <label>Precio Venta:</label>
                                        <input type="number" id="precio">
                                    </div>
                                    <div class="form-field">
                                        <label>Precio Compra:</label>
                                        <input type="text">
                                    </div>
                                    <div class="form-field">
                                        <label>Moneda:</label>
                                        <input type="text" id="moneda" value="Bs">
                                    </div>
                                </div>
                                <div class="form-field">
                                    <label>Imagen</label>
                                    <img class="imagen-box" id="preview" width="120">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TAB PRECIOS -->
                    <div id="tab-precios" class="tab-content hidden">
                        <h4>Formulario de Precios</h4>
                        <div class="form-field">
                            <label>Precio Mayorista</label>
                            <input type="number" id="precio-mayorista">
                        </div>
                        <div class="form-field">
                            <label>Precio Público</label>
                            <input type="number" id="precio-publico">
                        </div>
                    </div>

                    <!-- TAB DISPONIBLE -->
                    <div id="tab-disponible" class="tab-content hidden">
                        <h4>Formulario de Disponibilidad</h4>
                        <div class="form-field">
                            <label>Stock Actual</label>
                            <input type="number" id="stock">
                        </div>
                        <div class="form-field">
                            <label>Stock Mínimo</label>
                            <input type="number" id="minimo">
                        </div>
                    </div>

                </div>

                <!-- BOTONES DE NAVEGACION -->
                <div class="navigation-bar">
                    <button id="btnFirst" class="nav-btn">⏮️</button>
                    <button id="btnUp2" class="nav-btn">◀◀</button>
                    <button id="btnPrev" class="nav-btn">◀</button>
                    <button id="btnNext" class="nav-btn">▶</button>
                    <button id="btnDown2" class="nav-btn">▶▶</button>
                    <button id="btnLast" class="nav-btn">⏭️</button>

                    <button id="btnNew" class="nav-btn">➕</button>
                    <button id="btnDelete" class="nav-btn">➖</button>
                    <button id="btnSave" class="nav-btn">✓</button>
                    <button id="btnCancel" class="nav-btn">✕</button>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
    <script src="mi-modal.js"></script>
    <mi-modal></mi-modal>

    <button onclick="document.querySelectorAll('mi-modal')[0].open()">Abrir Modal 1</button>
</body>

</html>
