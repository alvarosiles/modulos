<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sistema de Productos</title>
<link rel="stylesheet" href="css/producto.css">
</head>
<body>

<div class="container">

    <!-- FORMULARIO -->
    <div class="form-section" id="formProducto">

        <h2>Registro de Producto</h2>

        <div class="form-grid">
            <input id="codigo" placeholder="Código">
            <input id="descripcion" placeholder="Descripción">
            <input id="marca" placeholder="Marca">

            <select id="grupo">
                <option value="">Grupo</option>
                <option value="1">Bebidas</option>
                <option value="2">Comidas</option>
                <option value="3">Limpieza</option>
            </select>

            <select id="subgrupo">
                <option value="">SubGrupo</option>
                <option value="1">Gaseosas</option>
                <option value="2">Jugos</option>
                <option value="3">Congelados</option>
            </select>

            <select id="origen">
                <option value="">Origen</option>
                <option value="1">Nacional</option>
                <option value="2">Importado</option>
                <option value="3">Artesanal</option>
            </select>

            <input id="minimo" type="number" placeholder="Stock Mínimo">
            <input id="maximo" type="number" placeholder="Stock Máximo">
        </div>

        <!-- BOTONES -->
        <div class="nav-buttons">
            <button class="nav-btn btn-primero">◀◀</button>
            <button class="nav-btn btn-anterior">◀</button>
            <button class="nav-btn btn-siguiente">▶</button>
            <button class="nav-btn btn-ultimo">▶▶</button>
            <button class="nav-btn btn-nuevo">➕</button>
            <button class="nav-btn btn-guardar">✓</button>
        </div>

    </div>

    <!-- TABLA -->
    <div class="table-section">
        <table id="tablaProductos">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Descripción</th>
                    <th>Marca</th>
                    <th>Mín</th>
                    <th>Máx</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

</div>

<script src="js/producto.js"></script>
</body>
</html>
