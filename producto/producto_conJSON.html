<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productos - Registro</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:'MS Sans Serif',Arial;
    background:#4a7ba7;
    padding:20px;
}
.window{
    background:#ecf0f1;
    border:2px solid;
    border-color:#dfdfdf #808080 #808080 #dfdfdf;
}
.title-bar{
    background:linear-gradient(to right,#000080,#1084d7);
    color:white;
    padding:4px;
    font-size:12px;
}
.content{
    padding:10px;
}
.search-box{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}
.search-box input{
    flex:1;
    padding:4px;
}
table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
    background:white;
}
th,td{
    border:1px solid #999;
    padding:6px;
    text-align:left;
}
thead{
    background:#b4cce1;
}
.counter{
    margin-top:8px;
    font-size:12px;
}
</style>

</head>
<body>

<div class="window">
    <div class="title-bar">REGISTRO DE PRODUCTOS (JSON)</div>
    <div class="content">

        <div class="search-box">
            <label>Buscar:</label>
            <input type="text" id="buscar">
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Más Vendido</th>
                </tr>
            </thead>
            <tbody id="tablaBody">
                <tr>
                    <td colspan="6" style="text-align:center;color:#999;">
                        Cargando datos...
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="counter">
            Total: <span id="contador">0</span>
        </div>

    </div>
</div>

<script>

let productos = [];
const tbody = document.getElementById("tablaBody");
const contador = document.getElementById("contador");
const buscador = document.getElementById("buscar");

/* =========================
   CARGAR JSON
========================= */

async function cargarProductos() {
    try {
        const response = await fetch("./item.json");
        const data = await response.json();
        productos = data;
        renderTabla();
    } catch (error) {
        tbody.innerHTML = `
            <tr>
                <td colspan="6" style="text-align:center;color:red;">
                    Error cargando item.json
                </td>
            </tr>`;
        console.error(error);
    }
}

/* =========================
   RENDER TABLA
========================= */

function renderTabla(filtro = "") {

    const lista = productos.filter(p =>
        p.nombre.toLowerCase().includes(filtro.toLowerCase())
    );

    if(lista.length === 0){
        tbody.innerHTML = `
            <tr>
                <td colspan="6" style="text-align:center;color:#999;">
                    No hay datos
                </td>
            </tr>`;
        contador.innerText = 0;
        return;
    }

    tbody.innerHTML = lista.map(p => `
        <tr>
            <td>${p.id}</td>
            <td>${p.nombre}</td>
            <td>${p.descripcion}</td>
            <td>${p.categoria}</td>
            <td>${p.precio} ${p.moneda}</td>
            <td>${p.mas_vendido ? "🔥 Sí" : "No"}</td>
        </tr>
    `).join("");

    contador.innerText = lista.length;
}

/* =========================
   BUSCADOR
========================= */

buscador.addEventListener("input", e => {
    renderTabla(e.target.value);
});

/* =========================
   INICIAR
========================= */

cargarProductos();

</script>

</body>
</html>
