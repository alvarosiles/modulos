<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restobar | Inventario</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

  <div class="layout">

    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">

      <header class="topbar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <h1 id="pageTitle">Inventario</h1>
      </header>

      <main class="content">

        <section class="cards-grid" style="margin-bottom:20px;">
          <div class="card">
            <span class="card-label">🟢 Stock disponible</span>
            <span class="card-value" id="countDisponible">0</span>
          </div>
          <div class="card card-warning">
            <span class="card-label">🟡 Stock bajo</span>
            <span class="card-value" id="countBajo">0</span>
          </div>
          <div class="card">
            <span class="card-label" style="color: var(--error);">🔴 Sin stock</span>
            <span class="card-value" id="countSinStock" style="color: var(--error);">0</span>
          </div>
        </section>

        <section class="panel" style="margin-bottom: 20px;">
          <div class="page-header">
            <h2 id="formTitulo">Nuevo ingrediente</h2>
          </div>

          <form id="formInventario">
            <input type="hidden" id="itemId">
            <div class="form-grid">
              <div class="form-group">
                <label for="producto">Producto / Ingrediente</label>
                <input type="text" id="producto" required>
              </div>
              <div class="form-group">
                <label for="cantidadActual">Cantidad actual</label>
                <input type="number" id="cantidadActual" min="0" step="0.5" required>
              </div>
              <div class="form-group">
                <label for="unidad">Unidad</label>
                <input type="text" id="unidad" placeholder="kg, unidades, paquetes..." required>
              </div>
              <div class="form-group">
                <label for="stockMinimo">Stock mínimo</label>
                <input type="number" id="stockMinimo" min="0" step="0.5" required>
              </div>
            </div>
            <div class="form-actions">
              <button type="button" class="btn" id="cancelarEdicion" style="display:none;">Cancelar</button>
              <button type="submit" class="btn btn-primary" id="submitLabel">Guardar</button>
            </div>
          </form>
        </section>

        <section class="panel">
          <div class="toolbar">
            <input type="text" id="buscarItem" placeholder="Buscar ingrediente...">
          </div>

          <table class="table">
            <thead>
              <tr>
                <th>Producto</th>
                <th>Cantidad actual</th>
                <th>Unidad</th>
                <th>Stock mínimo</th>
                <th>Estado</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tablaInventario"></tbody>
          </table>
        </section>

      </main>
    </div>
  </div>

  <script src="../js/sidebar.js"></script>
  <script src="../js/utils.js"></script>
  <script>renderSidebar("inventario", "../");</script>
  <script src="../js/inventario.js"></script>
</body>
</html>
