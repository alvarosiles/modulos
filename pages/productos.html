<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restobar | Productos</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

  <div class="layout">

    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">

      <header class="topbar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <h1 id="pageTitle">Productos</h1>
      </header>

      <main class="content">

        <section class="panel" style="margin-bottom: 20px;">
          <div class="page-header">
            <h2 id="formTitulo">Nuevo producto</h2>
          </div>

          <form id="formProducto">
            <input type="hidden" id="productoId">
            <div class="form-grid">
              <div class="form-group">
                <label for="nombre">Nombre del producto</label>
                <input type="text" id="nombre" required>
              </div>
              <div class="form-group">
                <label for="categoria">Categoría</label>
                <input type="text" id="categoria" placeholder="Hamburguesas, Bebidas..." required>
              </div>
              <div class="form-group">
                <label for="precio">Precio venta (Bs)</label>
                <input type="number" id="precio" min="0" step="0.5" required>
              </div>
              <div class="form-group">
                <label for="costo">Costo (Bs)</label>
                <input type="number" id="costo" min="0" step="0.5" required>
              </div>
              <div class="form-group">
                <label for="stockMinimo">Stock mínimo</label>
                <input type="number" id="stockMinimo" min="0" required>
              </div>
              <div class="form-group">
                <label for="estado">Estado</label>
                <select id="estado">
                  <option value="activo">Activo</option>
                  <option value="inactivo">Inactivo</option>
                </select>
              </div>
              <div class="form-group">
                <label for="imagen">Imagen (ruta)</label>
                <input type="text" id="imagen" placeholder="assets/images/producto.png">
              </div>
              <div class="form-group full">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" rows="2"></textarea>
              </div>
            </div>
            <div class="form-actions">
              <button type="button" class="btn" id="cancelarEdicion" style="display:none;">Cancelar</button>
              <button type="submit" class="btn btn-primary" id="submitLabel">Guardar producto</button>
            </div>
          </form>
        </section>

        <section class="panel">
          <div class="toolbar">
            <input type="text" id="buscarProducto" placeholder="Buscar por nombre o categoría...">
          </div>

          <table class="table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Costo</th>
                <th>Stock mín.</th>
                <th>Estado</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tablaProductos"></tbody>
          </table>
        </section>

      </main>
    </div>
  </div>

  <script src="../js/sidebar.js"></script>
  <script src="../js/utils.js"></script>
  <script>renderSidebar("productos", "../");</script>
  <script src="../js/productos.js"></script>
</body>
</html>
