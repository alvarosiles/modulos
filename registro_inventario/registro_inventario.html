<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Almacén</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(90deg, #17a2b8, #20c997);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-icon {
            width: 24px;
            height: 24px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .window-controls {
            display: flex;
            gap: 8px;
        }

        .control-btn {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .control-min {
            background: #ffc107;
            color: #333;
        }

        .control-max {
            background: #28a745;
            color: white;
        }

        .control-close {
            background: #dc3545;
            color: white;
        }

        .control-btn:hover {
            opacity: 0.8;
        }

        .title-bar {
            background: #17a2b8;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
        }

        .toolbar {
            background: #f8f9fa;
            padding: 15px 20px;
            display: flex;
            gap: 20px;
            border-bottom: 1px solid #dee2e6;
        }

        .toolbar-btn {
            background: white;
            border: 1px solid #dee2e6;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .toolbar-btn:hover {
            background: #e9ecef;
            border-color: #adb5bd;
        }

        .toolbar-btn.active {
            background: #17a2b8;
            color: white;
            border-color: #17a2b8;
        }

        .companies-section {
            padding: 15px 20px;
            border-bottom: 1px solid #dee2e6;
        }

        .companies-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
        }

        .companies-table th {
            background: #f0f0f0;
            padding: 10px;
            text-align: left;
            font-weight: bold;
            font-size: 13px;
            border-bottom: 2px solid #dee2e6;
        }

        .companies-table td {
            padding: 10px;
            border-bottom: 1px solid #dee2e6;
            font-size: 13px;
        }

        .empty-data {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }

        .record-counter {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .counter-input {
            width: 50px;
            padding: 5px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
        }

        .counter-btn {
            background: white;
            border: 1px solid #dee2e6;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
        }

        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            padding: 0 20px;
        }

        .tab {
            padding: 12px 20px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 14px;
            color: #495057;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .tab:hover {
            background: #e9ecef;
            color: #212529;
        }

        .tab.active {
            color: #17a2b8;
            border-bottom-color: #17a2b8;
        }

        .form-section {
            padding: 20px;
        }

        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 20px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
        }

        .form-field label {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #333;
        }

        .form-field input,
        .form-field select,
        .form-field textarea {
            padding: 8px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            background: #fffef0;
        }

        .form-field textarea {
            resize: vertical;
            min-height: 60px;
        }

        .form-field input:focus,
        .form-field select:focus,
        .form-field textarea:focus {
            outline: none;
            border-color: #17a2b8;
            box-shadow: 0 0 0 2px rgba(23, 162, 184, 0.1);
        }

        .textarea-controls {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .textarea-btn {
            background: white;
            border: 1px solid #dee2e6;
            width: 28px;
            height: 28px;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s;
        }

        .textarea-btn:hover {
            background: #e9ecef;
        }

        .details-section {
            padding: 0 20px 20px 20px;
        }

        .section-title {
            background: #6c757d;
            color: white;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .details-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #dee2e6;
        }

        .details-table th {
            background: #f0f0f0;
            padding: 12px;
            text-align: left;
            font-weight: bold;
            font-size: 13px;
            border-bottom: 2px solid #dee2e6;
        }

        .details-table td {
            padding: 12px;
            border-bottom: 1px solid #dee2e6;
            font-size: 13px;
        }

        .details-table tbody tr:hover {
            background: #f8f9fa;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: #f8f9fa;
            border-top: 1px solid #dee2e6;
        }

        .pagination-info {
            font-size: 13px;
            color: #666;
        }

        .pagination-controls {
            display: flex;
            gap: 4px;
        }

        .pag-btn {
            background: white;
            border: 1px solid #dee2e6;
            padding: 6px 8px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            transition: all 0.2s;
        }

        .pag-btn:hover {
            background: #e9ecef;
        }

        .pag-input {
            width: 60px;
            padding: 6px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            text-align: center;
            font-size: 13px;
        }

        .footer-section {
            padding: 15px 20px;
            background: #f8f9fa;
            border-top: 1px solid #dee2e6;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .footer-field {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .footer-field label {
            font-size: 13px;
            font-weight: 500;
            color: #333;
        }

        .footer-field select {
            padding: 6px 10px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            font-size: 13px;
            background: white;
            min-width: 150px;
        }

        .checkbox-field {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-field input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-field label {
            font-size: 13px;
            cursor: pointer;
            margin: 0;
        }

        .footer-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-consolidate {
            background: white;
            border: 1px solid #dee2e6;
            color: #333;
        }

        .btn-consolidate:hover {
            background: #e9ecef;
        }

        .btn-process {
            background: #28a745;
            color: white;
        }

        .btn-process:hover {
            background: #218838;
        }

        .btn-cancel {
            background: #dc3545;
            color: white;
        }

        .btn-cancel:hover {
            background: #c82333;
        }

        .full-width-input {
            width: 100%;
        }

        @media (max-width: 1024px) {
            .form-group {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .toolbar {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <div class="header-icon">◉</div>
                Registro de Almacen
            </h1>
            <div class="window-controls">
                <button class="control-btn control-min">_</button>
                <button class="control-btn control-max">□</button>
                <button class="control-btn control-close">✕</button>
            </div>
        </div>

        <!-- Title Bar -->
        <div class="title-bar">REGISTROS DE ALMACÉN</div>

        <!-- Toolbar -->
        <div class="toolbar">
            <button class="toolbar-btn">
                📥 Importar
            </button>
            <button class="toolbar-btn">
                🔄 Actualizar
            </button>
        </div>

        <!-- Companies Section -->
        <div class="companies-section">
            <table class="companies-table">
                <thead>
                    <tr>
                        <th>IdEmpresa</th>
                        <th>Nombre de la Empresa</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="2" class="empty-data">&lt;No data to display&gt;</td>
                    </tr>
                </tbody>
            </table>
            <div class="record-counter">
                <span>Registro:</span>
                <input type="text" class="counter-input" value="0" readonly>
                <button class="counter-btn">⬆</button>
                <button class="counter-btn">🔄</button>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab(this)">Registrar</button>
            <button class="tab" onclick="switchTab(this)">Históricos</button>
            <button class="tab" onclick="switchTab(this)">Buscar Producto</button>
        </div>

        <!-- Form Section -->
        <div class="form-section">
            <div class="form-group">
                <div class="form-field">
                    <label for="fecha">Fecha:</label>
                    <input type="date" id="fecha">
                </div>
                <div class="form-field">
                    <label for="almacen">Almacen:</label>
                    <select id="almacen">
                        <option>-- Seleccionar --</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <div class="form-field">
                    <label for="nrodoc">NroDoc:</label>
                    <input type="text" id="nrodoc">
                </div>
                <div class="form-field">
                    <label for="tiporegistro">Tipo Registro:</label>
                    <select id="tiporegistro">
                        <option>-- Seleccionar --</option>
                    </select>
                </div>
            </div>

            <div class="form-field">
                <label for="descripcion">Descripción:</label>
                <textarea id="descripcion"></textarea>
                <div class="textarea-controls">
                    <button class="textarea-btn">▲</button>
                    <button class="textarea-btn">✓</button>
                    <button class="textarea-btn">✕</button>
                </div>
            </div>
        </div>

        <!-- Details Section -->
        <div class="details-section">
            <div class="section-title">DETALLE DEL REGISTRO</div>
            <table class="details-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>IdProducto</th>
                        <th>Descripción</th>
                        <th>Cantidad</th>
                        <th>SubTotal</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="5" class="empty-data">&lt;No data to display&gt;</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="pagination">
            <div class="pagination-info">
                <input type="text" class="pag-input" value="0">
            </div>
            <div class="pagination-controls">
                <button class="pag-btn">◄◄</button>
                <button class="pag-btn">◄</button>
                <button class="pag-btn">▶</button>
                <button class="pag-btn">►►</button>
                <button class="pag-btn">+</button>
                <button class="pag-btn">−</button>
                <button class="pag-btn">✓</button>
                <button class="pag-btn">✕</button>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer-section">
            <div class="footer-left">
                <div class="footer-field">
                    <label for="cuenta">Cuenta:</label>
                    <select id="cuenta">
                        <option>-- Seleccionar --</option>
                    </select>
                </div>
                <div class="checkbox-field">
                    <input type="checkbox" id="consolidar">
                    <label for="consolidar">Consolidar</label>
                </div>
            </div>
            <div class="footer-actions">
                <button class="btn btn-consolidate">Consolidar</button>
                <button class="btn btn-process">✓ Procesar</button>
                <button class="btn btn-cancel">✕ Cancel</button>
            </div>
        </div>
    </div>

    <script>
        function switchTab(element) {
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
